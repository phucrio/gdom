name: Desktop builds

on:
  workflow_call:
    inputs:
      updater_signed:
        type: boolean
        default: false
      apple_signed:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: nsis
          - platform: windows-aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            bundles: nsis
          - platform: darwin-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            bundles: app,dmg
          - platform: darwin-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            bundles: app,dmg
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            bundles: appimage
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    environment: ${{ inputs.updater_signed && 'release' || 'ci' }}
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      APPIMAGE_EXTRACT_AND_RUN: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Require updater signing for Apple-signed builds
        if: ${{ inputs.apple_signed && !inputs.updater_signed }}
        run: |
          echo 'Apple-signed builds require signed Tauri updater artifacts.' >&2
          exit 1
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libsecret-1-dev gnome-keyring dbus-x11
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --all-features --target ${{ matrix.target }}
      - name: Native credential round trip (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          GDOM_NATIVE_KEYCHAIN_TESTS: 1
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} native_keychain_round_trip -- --ignored
      - name: Native Secret Service round trip (isolated session)
        if: runner.os == 'Linux'
        env:
          GDOM_NATIVE_KEYCHAIN_TESTS: 1
        run: |
          dbus-run-session -- sh -c 'printf "%s" "temporary-ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets; cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} native_keychain_round_trip -- --ignored'
      - name: Require production updater signing configuration
        if: inputs.updater_signed
        env:
          GDOM_DEFAULT_CLIENT_SECRET: ${{ secrets.GDOM_DEFAULT_CLIENT_SECRET }}
          GDOM_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for name in GDOM_DEFAULT_CLIENT_SECRET GDOM_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required release setting: $name"; exit 1; }
          done
      - name: Require Apple signing and notarization configuration
        if: ${{ inputs.apple_signed && runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            test -n "${!name}" || { echo "Missing required Apple release setting: $name"; exit 1; }
          done
      - name: Configure updater artifacts
        env:
          UPDATER_SIGNED_BUILD: ${{ inputs.updater_signed }}
          GDOM_UPDATER_PUBLIC_KEY: ${{ inputs.updater_signed && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
        run: |
          node --input-type=module - <<'JAVASCRIPT'
          import { writeFileSync } from 'node:fs';
          writeFileSync('updater-build.json', JSON.stringify({
            bundle: { createUpdaterArtifacts: process.env.UPDATER_SIGNED_BUILD === 'true' },
            plugins: { updater: { pubkey: process.env.GDOM_UPDATER_PUBLIC_KEY } },
          }));
          JAVASCRIPT
      - name: Build unsigned test package
        if: ${{ !inputs.updater_signed }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config updater-build.json
      - name: Build updater-signed Windows and Linux packages
        if: ${{ inputs.updater_signed && runner.os != 'macOS' }}
        env:
          GDOM_DEFAULT_CLIENT_SECRET: ${{ secrets.GDOM_DEFAULT_CLIENT_SECRET }}
          GDOM_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config updater-build.json
      - name: Build updater-signed Apple-unsigned macOS packages
        if: ${{ inputs.updater_signed && runner.os == 'macOS' && !inputs.apple_signed }}
        env:
          GDOM_DEFAULT_CLIENT_SECRET: ${{ secrets.GDOM_DEFAULT_CLIENT_SECRET }}
          GDOM_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config updater-build.json
      - name: Build updater- and Apple-signed macOS packages
        if: ${{ inputs.updater_signed && runner.os == 'macOS' && inputs.apple_signed }}
        env:
          GDOM_DEFAULT_CLIENT_SECRET: ${{ secrets.GDOM_DEFAULT_CLIENT_SECRET }}
          GDOM_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config updater-build.json
      - name: Stage artifacts with version and architecture
        env:
          GDOM_UPDATER_PUBLIC_KEY: ${{ inputs.updater_signed && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
        run: node scripts/release.mjs stage '${{ matrix.platform }}' staged '${{ inputs.updater_signed && 'updater-signed' || 'unsigned' }}' '${{ runner.os == 'macOS' && inputs.apple_signed && 'apple-signed' || 'apple-unsigned' }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.updater_signed && 'release' || 'test' }}-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error
