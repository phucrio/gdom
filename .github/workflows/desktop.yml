name: Desktop builds

on:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false
    secrets:
      GDOM_DEFAULT_CLIENT_SECRET:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            target: x86_64-pc-windows-msvc
            runner: windows-latest
            bundles: nsis
          - platform: windows-aarch64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
            bundles: nsis
          - platform: darwin-x86_64
            target: x86_64-apple-darwin
            runner: macos-15-intel
            bundles: app,dmg
          - platform: darwin-aarch64
            target: aarch64-apple-darwin
            runner: macos-15
            bundles: app,dmg
          - platform: linux-x86_64
            target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
            bundles: appimage
          - platform: linux-aarch64
            target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
            bundles: appimage
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_BUILD_JOBS: 1
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      APPIMAGE_EXTRACT_AND_RUN: 1
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf libfuse2 libsecret-1-dev gnome-keyring dbus-x11
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --workspace --all-targets --all-features --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --workspace --all-features --target ${{ matrix.target }}
      - name: Native credential round trip (Windows and macOS)
        if: runner.os != 'Linux'
        env:
          GDOM_NATIVE_KEYCHAIN_TESTS: 1
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} native_keychain_round_trip -- --ignored
      - name: Native Secret Service round trip (isolated session)
        if: runner.os == 'Linux'
        env:
          GDOM_NATIVE_KEYCHAIN_TESTS: 1
        run: |
          dbus-run-session -- sh -c 'printf "%s" "temporary-ci-keyring-password" | gnome-keyring-daemon --unlock --components=secrets; cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} native_keychain_round_trip -- --ignored'
      - name: Require production signing configuration
        if: inputs.signed
        env:
          GDOM_DEFAULT_CLIENT_SECRET: ${{ secrets.GDOM_DEFAULT_CLIENT_SECRET }}
          GDOM_UPDATER_PUBLIC_KEY: ${{ vars.TAURI_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for name in GDOM_DEFAULT_CLIENT_SECRET GDOM_UPDATER_PUBLIC_KEY TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            test -n "${!name}" || { echo "Missing required release setting: $name"; exit 1; }
          done
          if [ "$RUNNER_OS" = macOS ]; then
            for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              test -n "${!name}" || { echo "Missing required Apple release setting: $name"; exit 1; }
            done
          fi
      - name: Configure updater artifacts
        run: |
          printf '{"bundle":{"createUpdaterArtifacts":%s}}\n' '${{ inputs.signed }}' > updater-build.json
      - uses: tauri-apps/tauri-action@v0
        env:
          GDOM_DEFAULT_CLIENT_SECRET: ${{ inputs.signed && secrets.GDOM_DEFAULT_CLIENT_SECRET || '' }}
          GDOM_UPDATER_PUBLIC_KEY: ${{ inputs.signed && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          APPLE_CERTIFICATE: ${{ inputs.signed && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signed && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ inputs.signed && secrets.APPLE_SIGNING_IDENTITY || '' }}
          APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ inputs.signed && secrets.APPLE_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config updater-build.json
      - name: Stage artifacts with version and architecture
        env:
          GDOM_UPDATER_PUBLIC_KEY: ${{ inputs.signed && vars.TAURI_UPDATER_PUBLIC_KEY || '' }}
        run: node scripts/release.mjs stage '${{ matrix.platform }}' staged '${{ inputs.signed && 'signed' || 'unsigned' }}'
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.signed && 'release' || 'test' }}-${{ matrix.platform }}
          path: staged/*
          if-no-files-found: error
