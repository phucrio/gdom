name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      signed:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/release.mjs check
      - run: node --test scripts/release.test.mjs
      - run: pnpm icons:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm qa:typecheck
      - run: pnpm exec playwright install chromium
      - run: pnpm ui:qa
        env:
          GDOM_QA_BROWSER: chromium

  desktop:
    uses: ./.github/workflows/desktop.yml
    with:
      signed: ${{ inputs.signed || false }}
    secrets: inherit

  validate:
    if: always()
    needs: [frontend, desktop]
    runs-on: ubuntu-22.04
    steps:
      - name: Require every frontend and desktop lane
        env:
          FRONTEND: ${{ needs.frontend.result }}
          DESKTOP: ${{ needs.desktop.result }}
        run: test "$FRONTEND" = success && test "$DESKTOP" = success
