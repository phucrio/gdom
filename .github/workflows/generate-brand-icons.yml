name: Generate approved GDOM icons

on:
  push:
    branches: [feat/gdom-primary-icons-assets]
    paths:
      - src/assets/gdom-icon.svg
      - scripts/generate-icons.mjs
      - src/assets/icons.test.ts
      - .github/workflows/generate-brand-icons.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gdom-primary-icons-assets
      - uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Wire approved branding
        shell: python
        run: |
          import json
          from pathlib import Path

          def replace_once(name, old, new):
              path = Path(name)
              content = path.read_text(encoding='utf-8')
              assert content.count(old) == 1, f'Unexpected content in {name}'
              path.write_text(content.replace(old, new), encoding='utf-8', newline='\n')

          replace_once('src/App.tsx', 'import type { BackendPort }', 'import gdomIcon from "./assets/gdom-icon.svg";\nimport type { BackendPort }')
          replace_once('src/App.tsx', '  BRAND_MARK,\n  BRAND_NAME,', '  BRAND_NAME,')
          replace_once('src/App.tsx', '            {BRAND_MARK}', '            <img src={gdomIcon} width={24} height={24} alt="" />')
          replace_once('src/nav/copy.ts', 'export const BRAND_MARK = "G";\n\n', '\n')
          replace_once('index.html', '    <meta name="viewport"', '    <link rel="icon" type="image/svg+xml" href="/src/assets/gdom-icon.svg" />\n    <meta name="viewport"')
          replace_once('.github/workflows/ci.yml', '      - run: pnpm lint\n', '      - run: pnpm icons:check\n      - run: pnpm lint\n')
          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          data['scripts']['icons'] = 'node scripts/generate-icons.mjs'
          data['scripts']['icons:check'] = 'node scripts/generate-icons.mjs --check'
          package.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8', newline='\n')
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons
      - run: pnpm icons:check
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - name: Commit generated assets and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/generate-brand-icons.yml
          git add src-tauri/icons src/App.tsx src/nav/copy.ts index.html package.json .github/workflows/ci.yml
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m 'feat(ui): apply approved GDOM branding and generated desktop icons'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:feat/gdom-primary-icons-assets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
