[changelog]
header_marker = "<!-- git-cliff: end of header -->"
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat=\"v\") }}] - {{ timestamp | date(format=\"%Y-%m-%d\") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for entry in commits | commit_groups(groups=commit_parsers_groups) %}
    ### {{ entry.group | striptags | trim | upper_first }}
    {% for commit in entry.commits %}
        - {% if commit.scope %}({{ commit.scope }}) {% endif %}\
            {% if commit.breaking %}[BREAKING] {% endif %}\
            {{ commit.message | split(pat="\\n") | first | upper_first }}\
    {% endfor %}
{% endfor %}
"""
trim = true
render_always = true

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
commit_parsers = [
    { message = ".*!:", group = "<!-- 0 -->Breaking Changes" },
    { body = ".*BREAKING CHANGE:.*", group = "<!-- 0 -->Breaking Changes" },
    { message = "^feat", group = "<!-- 1 -->Features" },
    { message = "^fix", group = "<!-- 2 -->Fixes" },
    { message = "^perf", group = "<!-- 3 -->Performance" },
    { message = "^revert", group = "<!-- 4 -->Reverts" },
    { message = "^Merge ", skip = true },
    { message = "^(docs?|test|style|refactor|chore|ci|build)", skip = true },
    { message = ".*", group = "<!-- 5 -->Other Changes" },
]
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"

[bump]
features_always_bump_minor = false
breaking_always_bump_major = false
initial_tag = "v0.1.0"
